name: CI

# Runs only for branches pushed to this repository. Pull requests from forks never run
# on the self-hosted runner, which also builds and signs releases.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:main

      # Other jobs on this runner account can temporarily add signing keychains to the
      # search list, so never let CI discover an identity.
      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn run pack
